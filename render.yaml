services:
  # 1. FastAPI Production Backend
  - type: web
    name: vignai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db_init --seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vignai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set to your production frontend URL (e.g. https://vignai-os.vercel.app)
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_PROVIDER
        value: gemini
      - key: ENABLE_DEMO_SEEDING
        value: "true"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health

databases:
  # 2. Managed Production PostgreSQL
  - name: vignai-postgres
    databaseName: vignai_db
    user: vignai_user
    plan: standard
